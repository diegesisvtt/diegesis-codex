name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  tag:
    name: Bump version & tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump patch version if needed and push tag
        id: tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version=$(node -p "require('./package.json').version")
          if git rev-parse "v$version" >/dev/null 2>&1; then
            version=$(npm version patch --no-git-tag-version | sed 's/^v//')
            git add package.json package-lock.json
            git commit -m "chore(release): v$version"
          fi
          git tag "v$version"
          git push origin main
          git push origin "v$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build & publish (${{ matrix.os }})
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build & publish release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish always

  notes:
    name: Generate release notes
    needs: [tag, build]
    runs-on: ubuntu-latest
    steps:
      - name: Auto-generate release notes from merged PRs/commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          notes=$(gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$TAG" -q .body)
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes "$notes"
