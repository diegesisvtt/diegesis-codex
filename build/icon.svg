<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="80%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1017"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="facetA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="facetB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <polygon points="512,182 798,347 798,677 512,842 226,677 226,347"
           fill="none" stroke="#00F2FE" stroke-width="52" opacity="0.35"
           filter="url(#glow)"/>

  <g stroke-linejoin="round" stroke-linecap="round">
    <polygon points="512,182 798,347 798,677 512,842 226,677 226,347"
             fill="none" stroke="url(#stroke)" stroke-width="36"/>

    <g stroke="none">
      <polygon points="512,512 512,182 798,347" fill="url(#facetA)"/>
      <polygon points="512,512 798,677 512,842" fill="url(#facetB)"/>
      <polygon points="512,512 226,677 226,347" fill="url(#facetA)" opacity="0.55"/>
    </g>

    <g stroke="url(#stroke)" stroke-width="26" opacity="0.9">
      <line x1="512" y1="512" x2="512" y2="182"/>
      <line x1="512" y1="512" x2="798" y2="347"/>
      <line x1="512" y1="512" x2="798" y2="677"/>
      <line x1="512" y1="512" x2="512" y2="842"/>
      <line x1="512" y1="512" x2="226" y2="677"/>
      <line x1="512" y1="512" x2="226" y2="347"/>
    </g>

    <circle cx="512" cy="512" r="34" fill="#0F172A" stroke="url(#stroke)" stroke-width="24"/>
  </g>
</svg>
