appId: com.diegesis.codex
productName: Diegesis Codex
directories:
  buildResources: build
  output: release
files:
  - dist/**
  - dist-electron/**
  - package.json
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/sqlite-vec/**
  - node_modules/onnxruntime-node/**
publish:
  provider: github
  releaseType: release
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Diegesis Codex
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
linux:
  target:
    - AppImage
    - deb
  category: Office
